type User @table {
  displayName: String!
  email: String!
  createdAt: Timestamp!
  photoUrl: String
  bio: String
}

type ContentItem @table {
  url: String!
  title: String!
  createdAt: Timestamp!
  isPublic: Boolean!
  description: String
  imageUrl: String
  tags: [String]
  user: User
}

type Collection @table {
  name: String!
  createdAt: Timestamp!
  isPublic: Boolean!
  description: String
  user: User
}

type CollectionContentItem @table(key: ["collection", "contentItem"]) {
  position: Int!
  note: String
  collection: Collection!
  contentItem: ContentItem!
}

type Comment @table {
  text: String!
  createdAt: Timestamp!
  user: User
  parentCommentId: UUID
  contentItem: ContentItem
  collection: Collection
}